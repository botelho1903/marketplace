services:
  app:
    environment:
      - NEXT_PUBLIC_APP_URL=https://seu-dominio.com
      - NEXTAUTH_URL=https://seu-dominio.com
    deploy:
      replicas: 3  # Adjust based on your server capacity

  nginx:
    environment:
      - DOMAIN=seu-dominio.com
      - EMAIL=admin@seu-dominio.com  # For Let's Encrypt notifications