# ============================================================
# MARKETPLACE - Nginx Site Configuration
# ============================================================
# Replace seu-dominio.com with your actual domain

# HTTP -> HTTPS Redirect + ACME Challenge
server {
    listen 80;
    listen [::]:80;
    server_name seu-dominio.com www.seu-dominio.com;

    # ACME Challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seu-dominio.com www.seu-dominio.com;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/seu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seu-dominio.com/privkey.pem;
    ssl_dhparam /etc/nginx/dhparam.pem;

    # HSTS (1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://sdk.mercadopago.com https://www.mercadopago.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.mercadopago.com https://www.mercadopago.com wss://*.mercadopago.com; frame-src 'self' https://www.mercadopago.com https://sdk.mercadopago.com; base-uri 'self'; form-action 'self';" always;

    # Root for static files (Next.js public)
    root /app/public;

    # Next.js Static Files (with caching)
    location /_next/static/ {
        proxy_pass http://nextjs_backend;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Next.js Public Files
    location /public/ {
        proxy_pass http://nextjs_backend;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # API Routes - with rate limiting
    location /api/ {
        # Rate limiting
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        # Stricter rate limits for auth endpoints
        location ~* /api/auth/(login|register|forgot-password|reset-password) {
            limit_req zone=login burst=5 nodelay;
        }

        # Payment endpoints
        location ~* /api/pagamentos {
            limit_req zone=payment burst=10 nodelay;
        }

        # Webhooks - allow MercadoPago IPs
        location /api/webhooks/ {
            # MercadoPago IP ranges (update periodically)
            # allow 54.88.0.0/14;  # AWS us-east-1 (MercadoPago)
            # deny all;  # Uncomment and configure for production

            proxy_pass http://nextjs_backend;
            proxy_read_timeout 60s;
        }

        proxy_pass http://nextjs_backend;
    }

    # Health Check (no rate limit)
    location /api/health {
        access_log off;
        proxy_pass http://nextjs_backend;
    }

    # WebSocket Support (for real-time features)
    location /_next/webpack-hmr {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Main Application - Proxy to Next.js
    location / {
        proxy_pass http://nextjs_backend;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            proxy_pass http://nextjs_backend;
        }
    }

    # Error Pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Deny access to sensitive files
    location ~* \.(env|git|gitignore|docker|sql|log)$ {
        deny all;
        return 404;
    }

    location ~* /\. {
        deny all;
        return 404;
    }
}

