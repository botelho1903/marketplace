name: Cron - Process Webhook Retries

on:
  schedule:
    # Runs every 2 minutes
    - cron: '*/2 * * * *'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read

jobs:
  process-webhook-retries:
    name: Process Webhook Retries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call webhook retry endpoint
        run: |
          curl -X POST "${{ secrets.NEXT_PUBLIC_APP_URL }}/api/cron/process-webhook-retries" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 30 \
            --fail \
            --silent \
            --show-error || echo "Cron job failed or no retries to process"
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}