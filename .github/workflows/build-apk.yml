name: Build Android APK

on:
  push:
    branches: [main, release/*]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  # Configure these in GitHub Repository Settings → Secrets and variables → Actions
  CAPACITOR_SERVER_URL: ${{ secrets.CAPACITOR_SERVER_URL }}
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  build-apk:
    name: Build APK (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      packages: write

    steps:
      # ============================================================
      # 1. CHECKOUT & SETUP
      # ============================================================
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
          cmdline-tools-version: latest
          build-tools-version: 34.0.0

      - name: 📦 Cache Gradle & Node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            node_modules
            .next/cache
          key: ${{ runner.os }}-${{ hashFiles('package-lock.json', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: 📦 Install npm dependencies
        run: npm ci
        env:
          CAPACITOR_SERVER_URL: ${{ env.CAPACITOR_SERVER_URL }}

      # ============================================================
      # 3. BUILD NEXT.JS (Static export for Capacitor)
      # ============================================================
      - name: 🏗️ Build Next.js for Capacitor
        run: |
          # Create temporary next.config for static export
          cat > next.config.capacitor.js << 'EOF'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            reactStrictMode: true,
            output: 'export',
            images: { unoptimized: true },
            trailingSlash: true,
            experimental: { serverActions: { bodySizeLimit: '2mb' } },
          }
          module.exports = nextConfig
          EOF
          npm run build
        env:
          NODE_ENV: production
          DISABLE_IMAGE_OPTIMIZATION: 'true'

      # ============================================================
      # 4. CONFIGURE CAPACITOR
      # ============================================================
      - name: ⚙️ Configure Capacitor
        run: |
          # Update capacitor.config.ts with production URL
          if [ -n "${{ env.CAPACITOR_SERVER_URL }}" ]; then
            sed -i "s|url: process.env.CAPACITOR_SERVER_URL || 'https://yourdomain.vercel.app'|url: '${{ env.CAPACITOR_SERVER_URL }}'|" capacitor.config.ts
          fi
          cat capacitor.config.ts

      - name: 🔄 Sync Capacitor
        run: npx cap sync android

      # ============================================================
      # 5. BUILD ANDROID APK
      # ============================================================
      - name: 🔐 Setup Keystore (Release only)
        if: github.event.inputs.build_type == 'release' || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ env.KEYSTORE_BASE64 }}" | base64 -d > android/app/marketplace-release.jks
          echo "KEYSTORE_PATH=android/app/marketplace-release.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ env.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ env.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ env.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: 🔨 Build Debug APK
        if: github.event.inputs.build_type != 'release' && github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: 🔐 Build Release APK (Signed)
        if: github.event.inputs.build_type == 'release' || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g" \
            -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD
        env:
          GRADLE_OPTS: "-Xmx4g"
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}

      # ============================================================
      # 6. UPLOAD ARTIFACTS
      # ============================================================
      - name: 📤 Upload Debug APK
        if: github.event.inputs.build_type != 'release' && github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 📤 Upload Release APK
        if: github.event.inputs.build_type == 'release' || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      # ============================================================
      # 7. CREATE RELEASE (On tags)
      # ============================================================
      - name: 🚀 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Marketplace v${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 8. NOTIFY (Optional - Add Slack/Discord webhook)
      # ============================================================
      - name: 📢 Notify Build Complete
        if: always()
        run: |
          STATUS="${{ job.status }}"
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          echo "✅ Build $STATUS - APK ($BUILD_TYPE) ready for download"
          if [ "$STATUS" = "success" ]; then
            echo "📱 Download from Actions artifacts or GitHub Releases"
          fi

  # ============================================================
  # QUALITY CHECKS (Run in parallel)
  # ============================================================
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install deps
        run: npm ci

      - name: 🔍 TypeScript Check
        run: npx tsc --noEmit

      - name: 🧹 ESLint
        run: npm run lint

      - name: ✨ Prettier Check
        run: npx prettier --check .

      - name: 🗃️ Prisma Generate
        run: npx prisma generate

      - name: 🏗️ Next.js Build (Standalone for Vercel)
        run: npm run build
        env:
          NODE_ENV: production

  # ============================================================
  # DEPLOY TO VERCEL (On main branch)
  # ============================================================
  deploy-vercel:
    name: Deploy to Vercel
    needs: quality-checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        env:
          # These will be set in Vercel dashboard, but can also be passed here
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}
          MERCADO_PAGO_PUBLIC_KEY: ${{ secrets.MERCADO_PAGO_PUBLIC_KEY }}
          MERCADO_PAGO_WEBHOOK_SECRET: ${{ secrets.MERCADO_PAGO_WEBHOOK_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EMAIL_SERVER_HOST: ${{ secrets.EMAIL_SERVER_HOST }}
          EMAIL_SERVER_PORT: ${{ secrets.EMAIL_SERVER_PORT }}
          EMAIL_SERVER_USER: ${{ secrets.EMAIL_SERVER_USER }}
          EMAIL_SERVER_PASSWORD: ${{ secrets.EMAIL_SERVER_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          RATE_LIMIT_WINDOW_MS: ${{ secrets.RATE_LIMIT_WINDOW_MS }}
          RATE_LIMIT_MAX_REQUESTS: ${{ secrets.RATE_LIMIT_MAX_REQUESTS }}